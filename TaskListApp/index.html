<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    .app-container {
      max-width: 800px;
      margin: auto;
      padding: 1rem;
      box-sizing: border-box;
    }
    h1 {
      text-align: center;
      font-size: 2rem;
    }
    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .input-row input,
    .input-row select,
    .input-row button {
      flex: 1 1 100%;
      padding: 0.5rem;
      font-size: 1rem;
      box-sizing: border-box;
    }
    @media (min-width: 600px) {
      .input-row input,
      .input-row select {
        flex: 1 1 auto;
      }
      .input-row button {
        flex: 0 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h1>📋 Task Manager</h1>

    <div class="input-row">
      <select id="categorySelect">
        <option value="General">כללי</option>
        <option value="Groceries">רשימת קניות</option>
      </select>

      <input type="text" id="taskInput" placeholder="משימה חדשה...." />
      <input type="text" id="productInput" placeholder="מוצר" class="hidden" />
      <input type="number" id="amountInput" placeholder="כמות" class="hidden" />
      <button onclick="addTask()">➕ הוספה</button>
    </div>

    <div id="taskLists"></div>

    <h2>✅ משימות שהושלמו</h2>
    <div id="completedTasks"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
